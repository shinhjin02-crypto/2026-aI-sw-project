<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Full Screen Cards</title>
</head>
<body class="bg-black text-white">

  <!-- 카드 1 -->
  <section class="h-screen relative 
                  opacity-60 hover:opacity-100 
                  transition duration-500">

    <img src="https://picsum.photos/1200/800?1"
         class="absolute w-full h-full object-cover blur-sm hover:blur-0 transition duration-500">

    <div class="absolute inset-0 flex flex-col justify-center items-center text-center bg-black/40">
      <h1 class="text-4xl font-bold mb-4">카드 제목 1</h1>
      <p class="text-lg">여기에 카드 설명을 작성하세요</p>
    </div>
  </section>
