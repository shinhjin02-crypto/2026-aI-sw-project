<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-2xl font-bold">
      버튼들
    </h1>
    <div class="p-4 space-y-4">
    <!-- 배경색 : bg-{color}-{number}, bg-transparent, bg- white, bg-black --->

    <!-- 글자 모양 : text-sm, text-lg, text-xl ... -->
    <!-- 테두리 : border border-{color}-{number}, border-transparent, ... -->
    <!-- 테두리 : border-t, border-b, border-l, border-r / 특정 방향에 보더를 넣고 싶을 떄... -->
    <!-- 테두리 : shadow, shadow-md, shadow-lg ... / 그림자 -->
    <!-- 테두리 : rounded, rounded-full, rounded-sm ... / 그림자 -->
    <!--여백 : m-{number}-{color}, m-4, m-2 -->
    <!--여백 : mt-{number} p-4, mt-4, mt-2 -->
    <!--여백 : mt-{number} p-4,ml-{number}, mr-{number}, mb-{number}, 상하좌우-->
    <!--여백 : mx-{number}, my-{number}, 좌우 / 상하 -->
        <button class="bg-blue-500 hover:bg-blue-700 py-2 px-4 rounded font-bold text-white">버튼1</button>
        <button class="bg-blue-400 hover:bg-blue-600 py-2 px-4 rounded font-bold">버튼1</button>

    <div class="p-4 space-y-4">

    </div>

        <button class="text-red-500 border border-blue-500">버튼1</button>
        <button class="text-red-400 border border-blue-400">버튼1</button>
        <button class="text-red-300 border border-blue-300">버튼1</button>
