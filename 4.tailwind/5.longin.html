<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Login</title>
</head>

<body class="h-screen flex justify-center items-center bg-gray-100">

  <div class="w-[35%] bg-white rounded-2xl p-8
              shadow-[10px_10px_30px_rgba(0,0,0,0.4)]">

    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

    <!-- Username -->
    <div class="mb-4">
      <label class="block mb-1 font-semibold">Username</label>
      <input type="text"
             class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Password -->
    <div class="mb-6">
      <label class="block mb-1 font-semibold">Password</label>
      <input type="password"
             class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Button -->
    <button class="w-full bg-blue-500 text-white py-2 rounded-lg
                   hover:bg-blue-600 transition">
      로그인
    </button>

  </div>

</body>
</html>
