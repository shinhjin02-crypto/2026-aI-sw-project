<html>
    <head>
        <title>포토 캘린더</title>
        <style>
            h1, h2 {
                text-align: center;
            }

            #calendar {
                width: 100%;
                border: 1px solid black;


            }

            #calendar th { /* #calendar th : 밑에 있는 모든 th*/
                width: 14%; /* #calendar > th : calendar 바로 밑에 있는 th*/
                background-color: pink;
            }

            #calendar td {
                text-align: center;
                border: 1px solid black;
                padding: 10px;
            }

            #calendar th:first-child, #calendar td:first-child {
                color: red;
            }

            /* #calendar th:first-child, #calendar td:first-child */
            /* calendar id를 가지고 그 아래 어디에 있더니 th를 찾아서 first-child를 선택 */

            #calendar th:last-child {
                color: blue;
            }

            #calendar td:last-child {
                color: blue;
            }

            img {
                width: 100%;
            }
        </style>

    </head>
    <body>
        <h1>포토 캘린더</h1>
        <h2>2026년 04월</h2>
        <img src="image/scene1.jpeg" alt="이건 곰돌이 그림">
        <table id="calendar">
            <tr>
                <th style="color: red;">Sun</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td>10</td>
                <td>11</td>
            </tr>
            <tr>
                <td>12</td>
                <td>13</td>
                <td>14</td>
                <td>15</td>
                <td>16</td>
                <td>17</td>
                <td>18</td>
            </tr>
            <tr>
                <td>19</td>
                <td>20</td>
                <td>21</td>
                <td>22</td>
                <td>23</td>
                <td>24</td>
                <td>25</td>
            <tr>
                <td>26</td>

            </tr>
            
        </table>
    </body>
</html>
