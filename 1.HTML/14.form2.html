    <body>
        <h1>입력폼에 넣을 수 있는 다양한 값</h1>

        <input type="radio" name="음료" value="카푸치노">카푸치노

        <H2>풀다운 메뉴</H2>
        <select multiple>
            <option>사이다</option>
            <option>콜라</option>
            <option>환타</option>
            <option>우유</option>
            <option>초코우유</option>
            <option>딸기우유</option>
        </select>
        <select size="3" multiple>
            <option>사이다</option>
            <option>콜라</option>
            <option>환타</option>
            <option>우유</option>
            <option>초코우유</option>
            <option>딸기우유</option>
        </select>
