<html lang="en">
    <body>
        <form>
            <label>User 검색</label>
            <form id="search">
                <ul id="userlist"></ul>
            </form>

            <script>
                document.getElementById('search').addEventListener('submit', () => {

                })
            </script>
        </form>
    </body>
</html>
