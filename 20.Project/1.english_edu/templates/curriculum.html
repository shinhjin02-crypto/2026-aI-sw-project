{% extends "base.html" %}

{% block content %}

<h2>{{ grade }}학년 - {{ curriculum_title }}</h2>

<p>아래 채팅창에서 AI 영어 선생님과 대화할 수 있습니다.</p>

<div class="chat-box">

    <div class="chat-messages">
        <div class="ai-message">
            안녕하세요! 저는 {{ grade }}학년 {{ curriculum_title }} 수업을 도와줄 AI 영어 선생님입니다.
        </div>
    </div>

    <form id="chat-form">
        <input type="hidden" id="grade-input" value="{{ grade }}">
        <input type="hidden" id="curriculum-input" value="{{ curriculum_title }}">

        <input
            type="text"
            id="message-input"
            name="message"
            placeholder="질문을 입력하세요."
        >

        <button type="submit">전송</button>
    </form>
    <script>

        const chatForm = document.getElementById("chat-form");
        const messageInput = document.getElementById("message-input");
        const chatMessages = document.querySelector(".chat-messages");

        const gradeInput = document.getElementById("grade-input");
        const curriculumInput = document.getElementById("curriculum-input");

        chatForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const message = messageInput.value;

            // 사용자 메시지 화면 추가
            const userDiv = document.createElement("div");
            userDiv.className = "user-message";
            userDiv.textContent = message;

            chatMessages.appendChild(userDiv);

            // 입력창 초기화
            messageInput.value = "";

            // Flask /chat 로 전송
            const response = await fetch("/chat", {
                method: "POST",

                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },

                body: "message=" + encodeURIComponent(message) +
                      "&grade=" + encodeURIComponent(gradeInput.value) +
                      "&curriculum_title=" + encodeURIComponent(curriculumInput.value)
            });

            // 응답 받기
            const aiAnswer = await response.text();

            // AI 답변 화면 추가
            const aiDiv = document.createElement("div");
            aiDiv.className = "ai-message";
            aiDiv.textContent = aiAnswer;

            chatMessages.appendChild(aiDiv);

        });

</script>

</div>

{% endblock %}
