<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공유 일정 달력</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #333;
    }

    /* 로그인 화면 */
    #loginPage {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: linear-gradient(135deg, #eef4ff, #dbe7ff);
    }

    .logo-area {
      position: absolute;
      top: 30px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      color: #555;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #274690;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
    }

    .login-box {
      width: 360px;
      background: white;
      padding: 36px;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-box h1 {
      margin: 0 0 8px;
      font-size: 28px;
      text-align: center;
    }

    .login-box p {
      margin: 0 0 28px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .login-box label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #555;
    }

    .login-box input {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    .login-box input:focus {
      border-color: #274690;
      box-shadow: 0 0 0 4px rgba(39, 70, 144, 0.15);
    }

    .login-box button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #1e3a8a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-box button:hover {
      background: #162f6b;
      transform: translateY(-2px);
    }

    .login-info {
      margin-top: 18px;
      padding: 12px;
      background: #fafafa;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #777;
    }

    #loginMessage {
      margin-top: 14px;
      text-align: center;
      color: #e74c3c;
      font-size: 14px;
    }

    /* 달력 화면 */
    #calendarPage {
      display: none;
      min-height: 100vh;
      padding: 30px;
    }

    .calendar-container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 28px;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.07);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .user-area {
      color: #666;
      font-size: 14px;
    }

    .logout-btn {
      margin-left: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      background: #eee;
      cursor: pointer;
      transition: 0.2s;
    }

    .logout-btn:hover {
      background: #ddd;
    }

    .calendar-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      margin-bottom: 22px;
    }

    .calendar-header button {
      border: none;
      background: #dbe7ff;
      color: #274690;
      padding: 10px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .calendar-header button:hover {
      background: #c7d8ff;
      transform: scale(1.05);
    }

    #monthTitle {
      font-size: 30px;
      margin: 0;
      min-width: 220px;
      text-align: center;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      color: #777;
      margin-bottom: 10px;
    }

    .weekdays div {
      padding: 10px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day-cell {
      min-height: 120px;
      background: #fafafa;
      border-radius: 18px;
      padding: 12px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
      overflow: hidden;
      position: relative;
    }

    .day-cell:hover {
      transform: scale(1.06);
      background: #f4f7ff;
      border-color: #9fb7ee;
      box-shadow: 0 10px 24px rgba(39, 70, 144, 0.18);
      z-index: 2;
    }

    .empty-cell {
      background: transparent;
      cursor: default;
    }

    .empty-cell:hover {
      transform: none;
      box-shadow: none;
      border-color: transparent;
    }

    .day-number {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .today {
      background: #edf3ff;
      border-color: #274690;
    }

    .schedule-preview {
      font-size: 13px;
      padding: 5px 7px;
      margin-top: 5px;
      background: white;
      border-radius: 8px;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .schedule-preview.done {
      color: gray;
      text-decoration: line-through;
      background: #eee;
    }

    /* 모달 */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .modal {
      width: 430px;
      max-width: 100%;
      background: white;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.2);
      animation: fadeUp 0.3s ease;
    }

    .modal h2 {
      margin: 0 0 18px;
      font-size: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    #scheduleInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
    }

    #addScheduleBtn {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: #1e3a8a;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    #addScheduleBtn:hover {
      background: #162f6b;
    }

    #scheduleList {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 260px;
      overflow-y: auto;
    }

    #scheduleList li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #fafafa;
      border-radius: 12px;
    }

    .schedule-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .schedule-text.done {
      color: gray;
      text-decoration: line-through;
    }

    .delete-btn {
      border: none;
      background: #eee;
      padding: 7px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .delete-btn:hover {
      background: #dbe7ff;
    }

    .close-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      #calendarPage {
        padding: 14px;
      }

      .calendar-container {
        padding: 18px;
      }

      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .calendar-header {
        gap: 10px;
      }

      #monthTitle {
        font-size: 22px;
        min-width: 150px;
      }

      .calendar-grid {
        gap: 6px;
      }

      .day-cell {
        min-height: 90px;
        padding: 8px;
        border-radius: 14px;
      }

      .schedule-preview {
        font-size: 11px;
      }

      .logo-area {
        top: 20px;
        left: 20px;
      }
    }
  </style>
</head>

<body>
  <section id="loginPage">
    <div class="logo-area">
      <div class="logo-box">LOGO</div>
      <span>Company Name</span>
    </div>

    <div class="login-box">
      <h1>로그인</h1>
      <p>두 명만 사용하는 공유 일정 달력</p>

      <label for="userId">아이디</label>
      <input type="text" id="userId" placeholder="아이디를 입력하세요" />

      <label for="userPw">비밀번호</label>
      <input type="password" id="userPw" placeholder="비밀번호를 입력하세요" />

      <button id="loginBtn">로그인</button>

      <div class="login-info">
        테스트 계정<br />
        user1 / 1111<br />
        user2 / 2222
      </div>

      <div id="loginMessage"></div>
    </div>
  </section>

  <section id="calendarPage">
    <div class="calendar-container">
      <div class="top-bar">
        <div>
          <strong>공유 일정 달력</strong>
        </div>

        <div class="user-area">
          <span id="currentUserText"></span>
          <button class="logout-btn" id="logoutBtn">로그아웃</button>
        </div>
      </div>

      <div class="calendar-header">
        <button id="prevMonthBtn">이전달</button>
        <h1 id="monthTitle"></h1>
        <button id="nextMonthBtn">다음달</button>
      </div>

      <div class="weekdays">
        <div>일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div>토</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2 id="modalDateTitle"></h2>

      <div class="input-row">
        <input type="text" id="scheduleInput" placeholder="일정을 입력하세요" />
        <button id="addScheduleBtn">추가</button>
      </div>

      <ul id="scheduleList"></ul>

      <button class="close-btn" id="closeModalBtn">닫기</button>
    </div>
  </div>

  <script>
    const users = [
      { id: 'user1', pw: '1111' },
      { id: 'user2', pw: '2222' }
    ];

    const loginPage = document.getElementById('loginPage');
    const calendarPage = document.getElementById('calendarPage');
    const loginBtn = document.getElementById('loginBtn');
    const loginMessage = document.getElementById('loginMessage');
    const currentUserText = document.getElementById('currentUserText');
    const logoutBtn = document.getElementById('logoutBtn');

    const monthTitle = document.getElementById('monthTitle');
    const calendarGrid = document.getElementById('calendarGrid');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');

    const modalBg = document.getElementById('modalBg');
    const modalDateTitle = document.getElementById('modalDateTitle');
    const scheduleInput = document.getElementById('scheduleInput');
    const addScheduleBtn = document.getElementById('addScheduleBtn');
    const scheduleList = document.getElementById('scheduleList');
    const closeModalBtn = document.getElementById('closeModalBtn');

    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();
    let selectedDate = '';
    let currentUser = '';

    function login() {
      const inputId = document.getElementById('userId').value;
      const inputPw = document.getElementById('userPw').value;

      const foundUser = users.find(user => user.id === inputId && user.pw === inputPw);

      if (foundUser) {
        currentUser = foundUser.id;
        localStorage.setItem('currentUser', currentUser);
        showCalendarPage();
      } else {
        loginMessage.textContent = '아이디 또는 비밀번호가 틀렸습니다.';
      }
    }

    loginBtn.addEventListener('click', () => {
      login();
    });

    document.getElementById('userId').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        login();
      }
    });

    document.getElementById('userPw').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        login();
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('currentUser');
      currentUser = '';
      loginPage.style.display = 'flex';
      calendarPage.style.display = 'none';
    });

    function showCalendarPage() {
      loginPage.style.display = 'none';
      calendarPage.style.display = 'block';
      currentUserText.textContent = currentUser + '님 로그인 중';
      renderCalendar();
    }

    function getSchedules() {
      const data = localStorage.getItem('schedules');
      return data ? JSON.parse(data) : {};
    }

    function saveSchedules(schedules) {
      localStorage.setItem('schedules', JSON.stringify(schedules));
    }

    function makeDateKey(year, month, day) {
      const mm = String(month + 1).padStart(2, '0');
      const dd = String(day).padStart(2, '0');
      return year + '-' + mm + '-' + dd;
    }

    function renderCalendar() {
      calendarGrid.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
      const schedules = getSchedules();

      monthTitle.textContent = currentYear + '년 ' + (currentMonth + 1) + '월';

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty-cell';
        calendarGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDate; day++) {
        const dateKey = makeDateKey(currentYear, currentMonth, day);

        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell';

        if (
          currentYear === today.getFullYear() &&
          currentMonth === today.getMonth() &&
          day === today.getDate()
        ) {
          dayCell.classList.add('today');
        }

        const dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.textContent = day;
        dayCell.appendChild(dayNumber);

        if (schedules[dateKey]) {
          schedules[dateKey].slice(0, 3).forEach(item => {
            const preview = document.createElement('div');
            preview.className = 'schedule-preview';

            if (item.done) {
              preview.classList.add('done');
            }

            preview.textContent = item.text;
            dayCell.appendChild(preview);
          });
        }

        dayCell.addEventListener('click', () => {
          selectedDate = dateKey;
          openModal();
        });

        calendarGrid.appendChild(dayCell);
      }
    }

    prevMonthBtn.addEventListener('click', () => {
      currentMonth--;

      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }

      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      currentMonth++;

      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }

      renderCalendar();
    });

    function openModal() {
      modalBg.style.display = 'flex';
      modalDateTitle.textContent = selectedDate + ' 일정';
      scheduleInput.value = '';
      renderScheduleList();
    }

    closeModalBtn.addEventListener('click', () => {
      modalBg.style.display = 'none';
      renderCalendar();
    });

    addScheduleBtn.addEventListener('click', () => {
      const text = scheduleInput.value.trim();

      if (text === '') return;

      const schedules = getSchedules();

      if (!schedules[selectedDate]) {
        schedules[selectedDate] = [];
      }

      schedules[selectedDate].push({
        text: text,
        done: false,
        writer: currentUser
      });

      saveSchedules(schedules);
      scheduleInput.value = '';

      renderScheduleList();
      renderCalendar();
    });

    scheduleInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addScheduleBtn.click();
      }
    });

    function renderScheduleList() {
      scheduleList.innerHTML = '';

      const schedules = getSchedules();
      const daySchedules = schedules[selectedDate] || [];

      if (daySchedules.length === 0) {
        const emptyText = document.createElement('li');
        emptyText.textContent = '등록된 일정이 없습니다.';
        scheduleList.appendChild(emptyText);
        return;
      }

      daySchedules.forEach((item, index) => {
        const li = document.createElement('li');

        const left = document.createElement('div');
        left.className = 'schedule-left';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.done;

        const span = document.createElement('span');
        span.className = 'schedule-text';

        if (item.done) {
          span.classList.add('done');
        }

        span.textContent = item.text + ' (' + item.writer + ')';

        checkbox.addEventListener('change', () => {
          item.done = checkbox.checked;
          saveSchedules(schedules);
          renderScheduleList();
          renderCalendar();
        });

        left.appendChild(checkbox);
        left.appendChild(span);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '삭제';

        deleteBtn.addEventListener('click', () => {
          schedules[selectedDate].splice(index, 1);

          if (schedules[selectedDate].length === 0) {
            delete schedules[selectedDate];
          }

          saveSchedules(schedules);
          renderScheduleList();
          renderCalendar();
        });

        li.appendChild(left);
        li.appendChild(deleteBtn);
        scheduleList.appendChild(li);
      });
    }

    const savedUser = localStorage.getItem('currentUser');

    if (savedUser) {
      currentUser = savedUser;
      showCalendarPage();
    }
  </script>
</body>
</html>
