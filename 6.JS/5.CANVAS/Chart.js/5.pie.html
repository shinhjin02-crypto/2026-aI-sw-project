<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #myChart {
            width: 300px;
            height: 300px;
            display: block;
        }

        div {
            padding: 20px;
            overflow: visible;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <div>
        <canvas id="myChart"></canvas>
    </div>
    <script>
        const ctx = document.getElementById('myChart');

        const data = {
            labels: [
                'Red',
                'Blue',
                'Yellow'
            ],
            datasets: [{
                label: 'My First Dataset',
                data: [300, 50, 100],
                backgroundColor: [
                    'rgb(255, 99, 132)',
                    'rgb(54, 162, 235)',
                    'rgb(255, 205, 86)'
                ],
                hoverOffset: 10
            }]
        };

        const config = {
            type: 'pie',
            data: data,
            options: {
                reponsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: 20
                }
            }
        };
        const label = new Chart(ctx, config);

    </script>


</body>

</html>
