<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mydiv {
            display: none; /* 보이는건 block, 숨기는건 none*/
            width: 200px;
            height: 200px;
            background-color: lightsalmon;
        }
    </style>
</head>
<body>
    <h1>Show / Hide </h1>
    <button onclick="showhide()">숨겨진 요소 토글</button>
    <div id="mydiv"> 이것은 숨겨진 Div 요소 입니다.</div>
    <script>
        function showhide_() {
            const div = document.getElementById('mydiv');
            //const div = document.querySelector('#mydiv'); <-- 같은것임

            if (div.style.display == 'block') {
                div.style.display = 'none';

            } else {
                div.style.display = 'block';
            }
        }

    </script>
</body>
</html>
