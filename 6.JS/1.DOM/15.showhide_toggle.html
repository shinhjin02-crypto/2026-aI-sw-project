<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #mydiv {
            display: none; /* 보이는건 block, 숨기는건 none*/
            width: 200px;
            height: 200px;
            background-color: lightsalmon;
        }
        .show {
            display: block !important; /* 원래는 우선순위가 낮지만 자신을 우선순위에 두라는 것 */
        }
    </style>
</head>
<body>
    <h1>Show / Hide </h1>
    <button onclick="showhide_toggle()">숨겨진 요소 토글</button>
    <div id="mydiv"> 이것은 숨겨진 Div 요소 입니다.</div>
    <script>
        function showhide_toggle() {
            const div = document.querySelector('#mydiv');
            div.classList.toggle('show');
        }

    </script>
</body>
</html>
