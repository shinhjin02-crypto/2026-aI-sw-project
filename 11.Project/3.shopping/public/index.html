<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPC 쇼핑몰</title>
    <style>
        * {
        box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 40px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .product-image {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
    }

    .product-image img {
        width: 600px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .review-form {
        width: 700px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    textarea {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 10px;
        border: 1px solid #ccc;
        resize: none;
        font-size: 16px;
    }

    button {
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background-color: #4a90e2;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #357bd8;
    }

    .rating-box {
        margin-top: 20px;
    }

    .stars {
        display: flex;
        flex-direction: row-reverse;
        justify-content: flex-end;
    }

    .stars input {
        display: none;
    }

    .stars label {
        font-size: 40px;
        color: #ccc;
        cursor: pointer;
        transition: 0.2s;
    }

    .stars input:checked ~ label {
        color: gold;
    }

    .stars label:hover,
    .stars label:hover ~ label {
        color: gold;
    }

    #review-container {
        margin-top: 30px;
    }

    .ai-summary {
        background: #f0f7ff;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
    }

    .review-card {
        background: #fafafa;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
    }

    </style>
</head>
<body>
    <h1 id="title">상품 리뷰</h1>

    <div class="product-image">
        <img src="https://picsum.photos/600/400">
    </div>

    <!-- 리뷰 작성 폼 -->
    <section class="review-form">
        <h2 id="review-title">후기를 작성해주세요</h2>

        <div class="rating-box">
        <p>평점:</p>

        <div class="stars">
            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5">★</label>

            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4">★</label>

            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3">★</label>

            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2">★</label>

            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1">★</label>
        </div>
    </div>

        <textarea id="comment" placeholder="후기를 작성해주세요..." rows="5" cols="40"></textarea>
        <button id="send">제출</button>

        <!-- 리뷰 영역 -->
        <section>
            <h2>리뷰</h2>
            <div id="review-container">
                <div class="ai-summary">
                    <p><strong>AI 요약:</strong>현재는 리뷰가 없습니다.</p>
                    <p><strong>평균 별점:</strong>N/A</p>
                </div>
            </div>
        </section>
    </section>
    <script>
        const sendBtn = document.getElementById('send');
        const commentInput = document.getElementById('comment');
        const reviewContainer = document.getElementById('review-container');

        sendBtn.addEventListener('click', async () => {
            const rating = document.querySelector('input[name="rating"]:checked');
            const comment = commentInput.value;

            if (!rating || comment.trim() === '') {
                alert('평점과 후기를 입력해주세요.');
                return;
            }

            await fetch('/api/reviews', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    rating: rating.value,
                    comment: comment
                })
            });

            commentInput.value = '';
            rating.checked = false;

            loadReviews();
            loadAiSummary();
        });

        async function loadReviews() {
            const response = await fetch('/api/reviews');
            const reviews = await response.json();

            const reviewHtml = reviews.map((review) => {
                return `
                    <div>
                        <p><strong>평점:</strong> ${review.rating}점</p>
                        <p><strong>후기:</strong> ${review.comment}</p>
                        <hr>
                    </div>
                `;
            }).join('');

            reviewContainer.innerHTML = reviewHtml;
        }

        async function loadAiSummary() {
            const response = await fetch('/api/ai-summary');
            const data = await response.json();

            const summaryHtml = `
                <div class="ai-summary">
                    <p><strong>AI 요약:</strong> ${data.summary}</p>
                    <p><strong>평균 별점:</strong> ${data.average_rating}</p>
                </div>
            `;

            reviewContainer.innerHTML = summaryHtml + reviewContainer.innerHTML;
        }

        loadReviews();
        loadAiSummary();
    </script>
</body>
</html>
