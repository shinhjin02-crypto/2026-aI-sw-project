<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코드 취약점 분석기</title>
</head>
<body>
    <h1>코드 취약점 분석기</h1>

    <form id="codeForm">
        <input id="url" name="url" type="text" size="100" placeholder="GitHub 소스코드 URL을 입력하세요."><br><br>
        <button type="submit">분석 시작</button>
    </form>

    <h2>분석 결과</h2>
    <pre id="result"><!--결과가 출력될 곳--></pre>

    <script>
        document.getElementById('codeForm').addEventListener('submit', async (ev) => {
            ev.preventDefault();

            const url = document.getElementById('url').value;
            const result = document.getElementById('result');

            const response = await fetch('/api/codecheck', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    url: url
                })
            });

            const data = await response.json();

            console.log(data);

            result.textContent = data.result;
        });
    </script>
</body>
</html>
