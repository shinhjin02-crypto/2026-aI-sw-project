{% extends "base.html" %}

{% block content %}
<section class="select-page">
    <div class="cute-icon">🎒✏️🍭</div>

    <h2>{{ grade }}학년 커리큘럼</h2>
    <p>오늘 배울 영어 주제를 골라주세요.</p>

    <div class="card-grid">
        {% for idx, curriculum in curriculums %}
        <a class="select-card curriculum-card" href="{{ url_for('curriculum', grade=grade, curriculum_id=idx) }}">
            <div class="card-emoji">
                {% if idx == 0 %}🌼{% elif idx == 1 %}🧸{% else %}🚀{% endif %}
            </div>
            <div>{{ curriculum }}</div>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
