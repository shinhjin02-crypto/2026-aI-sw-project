{% extends "base.html" %}

{% block content %}
<section class="select-page">

    <h2>학년을 선택해 주세요</h2>
    <p>나에게 맞는 영어 수업을 골라볼까요?</p>

    <div class="card-grid">
        {% for grade in grades %}
        <a class="select-card grade-card" href="{{ url_for('grade', grade=grade) }}">
            <div class="card-emoji">
                {% if grade == 1 %}🐣
                {% elif grade == 2 %}🐰
                {% elif grade == 3 %}🐻
                {% elif grade == 4 %}🦊
                {% elif grade == 5 %}🦁
                {% elif grade == 6 %}🐯
                {% endif %}
            </div>
            <div>{{ grade }}학년</div>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
